openapi: 3.1.0
info:
  title: Assessment contracts
  version: 0.1.0
  description: Q2 schemas only. No assessment operations or workflows are implemented or enabled.
paths: {}
components:
  schemas:
    AssessmentLocale:
      type: string
      enum: [ar, en]
    AssessmentVisibility:
      type: string
      enum: [never, after_grading, after_attempt_limit, manual_release]
    AssessmentQuizPolicy:
      type: object
      additionalProperties: false
      required: [version, mode, required, passBasisPoints, maxAttempts, timeLimitSeconds, shuffleQuestions, shuffleOptions, scoreVisibility, reviewVisibility, explanationVisibility, aiAnalysisEnabled]
      properties:
        version: { type: integer, enum: [1] }
        mode: { type: string, enum: [practice, graded] }
        required: { type: boolean }
        passBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        maxAttempts: { type: [integer, "null"], minimum: 1 }
        timeLimitSeconds: { type: [integer, "null"], minimum: 60, maximum: 10800 }
        opensAt: { type: [string, "null"], format: date-time }
        closesAt: { type: [string, "null"], format: date-time }
        shuffleQuestions: { type: boolean }
        shuffleOptions: { type: boolean }
        scoreVisibility: { $ref: "#/components/schemas/AssessmentVisibility" }
        reviewVisibility: { $ref: "#/components/schemas/AssessmentVisibility" }
        explanationVisibility: { $ref: "#/components/schemas/AssessmentVisibility" }
        aiAnalysisEnabled: { type: boolean }
    AssessmentCode:
      type: object
      additionalProperties: false
      required: [language, source]
      properties:
        language: { type: string, enum: [java] }
        source: { type: string, minLength: 1, maxLength: 20000 }
    AssessmentLabel:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 20000 }
    AssessmentSingleChoiceAnswer:
      type: object
      additionalProperties: false
      required: [type, optionId]
      properties:
        type: { type: string, enum: [single_choice] }
        optionId: { type: string, minLength: 1, maxLength: 100 }
    AssessmentMultipleChoiceAnswer:
      type: object
      additionalProperties: false
      required: [type, optionIds]
      properties:
        type: { type: string, enum: [multiple_choice] }
        optionIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
    AssessmentTrueFalseAnswer:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [true_false] }
        value: { type: boolean }
    AssessmentShortTextAnswer:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { type: string, enum: [short_text] }
        text: { type: string, maxLength: 2000 }
    AssessmentOrderingAnswer:
      type: object
      additionalProperties: false
      required: [type, orderedItemIds]
      properties:
        type: { type: string, enum: [ordering] }
        orderedItemIds:
          type: array
          minItems: 2
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
    AssessmentAnswer:
      oneOf:
        - $ref: "#/components/schemas/AssessmentSingleChoiceAnswer"
        - $ref: "#/components/schemas/AssessmentMultipleChoiceAnswer"
        - $ref: "#/components/schemas/AssessmentTrueFalseAnswer"
        - $ref: "#/components/schemas/AssessmentShortTextAnswer"
        - $ref: "#/components/schemas/AssessmentOrderingAnswer"
      discriminator: { propertyName: type }
    AssessmentStudentQuestionFields:
      description: Safe selected-locale presentation. Never includes private definitions, explanations or taxonomy drafts.
      type: object
      additionalProperties: false
      required: [attemptQuestionId, type, locale, prompt, position, points]
      properties:
        attemptQuestionId: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [single_choice, multiple_choice, true_false, short_text, ordering] }
        locale: { $ref: "#/components/schemas/AssessmentLocale" }
        prompt: { type: string, minLength: 1, maxLength: 20000 }
        code: { $ref: "#/components/schemas/AssessmentCode" }
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: { $ref: "#/components/schemas/AssessmentLabel" }
        items:
          type: array
          minItems: 2
          maxItems: 20
          items: { $ref: "#/components/schemas/AssessmentLabel" }
        position: { type: integer, minimum: 0, maximum: 99 }
        points: { type: integer, minimum: 1, maximum: 1000 }
    AssessmentStudentQuestion:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/AssessmentStudentQuestionFields"
            - type: object
              required: [type, options]
              properties:
                type: { type: string, enum: [single_choice] }
                options:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items: { $ref: "#/components/schemas/AssessmentLabel" }
        - allOf:
            - $ref: "#/components/schemas/AssessmentStudentQuestionFields"
            - type: object
              required: [type, options]
              properties:
                type: { type: string, enum: [multiple_choice] }
                options:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items: { $ref: "#/components/schemas/AssessmentLabel" }
        - allOf:
            - $ref: "#/components/schemas/AssessmentStudentQuestionFields"
            - type: object
              required: [type]
              properties:
                type: { type: string, enum: [true_false] }
        - allOf:
            - $ref: "#/components/schemas/AssessmentStudentQuestionFields"
            - type: object
              required: [type]
              properties:
                type: { type: string, enum: [short_text] }
        - allOf:
            - $ref: "#/components/schemas/AssessmentStudentQuestionFields"
            - type: object
              required: [type, items]
              properties:
                type: { type: string, enum: [ordering] }
                items:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items: { $ref: "#/components/schemas/AssessmentLabel" }
      discriminator: { propertyName: type }
    AssessmentAnswerState:
      type: object
      additionalProperties: false
      required: [attemptQuestionId, answerRevision, answer]
      properties:
        attemptQuestionId: { type: string, minLength: 1, maxLength: 100 }
        answerRevision: { type: integer, minimum: 0 }
        answer:
          anyOf:
            - $ref: "#/components/schemas/AssessmentAnswer"
            - { type: "null" }
    AssessmentReviewFlag:
      description: Independent of answer revision, answer changes, correctness and engagement evidence.
      type: object
      additionalProperties: false
      required: [attemptQuestionId, isFlagged, flagRevision]
      properties:
        attemptQuestionId: { type: string, minLength: 1, maxLength: 100 }
        isFlagged: { type: boolean }
        flagRevision: { type: integer, minimum: 0 }
    AssessmentAttemptState:
      description: NOT_STARTED is derived, never persisted as an attempt.
      type: string
      enum: [IN_PROGRESS, SUBMITTED, AUTO_SUBMITTED, GRADED]
    AssessmentDeadlineReason:
      type: string
      enum: [time_limit, availability_close, both]
    AssessmentResponseEvidenceState:
      type: string
      enum: [correct_answered, incorrect_answered, unanswered_viewed, unanswered_unviewed]
    AssessmentEvidenceContext:
      description: No recorded view is not proof of never seeing a question. Flags are not engagement evidence.
      type: object
      additionalProperties: false
      required: [responseState, hasRecordedView, observationQuality, finalizationReason]
      properties:
        responseState: { $ref: "#/components/schemas/AssessmentResponseEvidenceState" }
        hasRecordedView: { type: boolean }
        observationQuality: { type: string, enum: [complete, partial, unknown] }
        finalizationReason: { type: string, enum: [voluntary_submission, time_limit, availability_close, both] }
