openapi: 3.1.0
info: { title: Api, version: 0.1.0 }
paths:
  /admin/{scope}/{parentId}/media-library/revisions/{revisionId}/processing:
    parameters: &params [{ $ref: "#/components/parameters/Scope" }, { $ref: "#/components/parameters/Parent" }, { $ref: "#/components/parameters/ProcessingRevision" }]
    get:
      operationId: mediaProcessingStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Sanitized processing status; Admin MFA required, content: { application/json: { schema: { $ref: "#/components/schemas/ProcessingStatus" } } } }
        default: { $ref: "#/components/responses/Error" }
  /admin/{scope}/{parentId}/media-library/revisions/{revisionId}/processing/upload:
    parameters: *params
    post:
      operationId: mediaProcessingUpload
      security: [{ bearerAuth: [] }]
      description: Direct private staging upload. Single uploads at most 8 MiB; larger revisions require multipart. Never grants clean/ready status.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProcessingUploadInput" } } } }
      responses:
        "201": { description: Temporary staging write authorization, headers: { Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ProcessingUpload" } } } }
        default: { $ref: "#/components/responses/Error" }
  /admin/{scope}/{parentId}/media-library/revisions/{revisionId}/processing/parts:
    parameters: *params
    post:
      operationId: mediaProcessingPart
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProcessingPartInput" } } } }
      responses:
        "201": { description: Exact-size temporary part write authorization, content: { application/json: { schema: { $ref: "#/components/schemas/ProcessingPart" } } } }
        default: { $ref: "#/components/responses/Error" }
  /admin/{scope}/{parentId}/media-library/revisions/{revisionId}/processing/complete:
    parameters: *params
    post:
      operationId: mediaProcessingComplete
      security: [{ bearerAuth: [] }]
      description: Verifies uploaded metadata and pins immutable private source before durably enqueueing exactly one revision job. Completion is not publication.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProcessingCompleteInput" } } } }
      responses:
        "201": { description: Durable processing job, content: { application/json: { schema: { type: object, required: [job], properties: { job: { $ref: "#/components/schemas/ProcessingJob" } } } } } }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    ProcessingRevision: { in: path, name: revisionId, required: true, schema: { type: string, format: uuid } }
  responses: {}
  schemas:
    ProcessingUploadInput:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: { type: string, enum: [single, multipart] }
    ProcessingPartInput:
      type: object
      additionalProperties: false
      required: [partNumber]
      properties:
        partNumber: { type: integer, minimum: 1, maximum: 256 }
    ProcessingCompleteInput:
      type: object
      additionalProperties: false
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/ProcessingCompletedPart"
    ProcessingCompletedPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber: { type: integer, minimum: 1, maximum: 256 }
        etag: { type: string, pattern: '^"[a-fA-F0-9-]{1,80}"$' }
    ProcessingJob:
      type: object
      additionalProperties: false
      required: [state, stage, attempts, failures, errorCode]
      properties:
        state: { type: string, enum: [queued, running, retryable, succeeded, permanently_failed] }
        stage: { type: string, enum: [scan, ingest, ingest_requested, verify, document] }
        attempts: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        errorCode: { type: [string, "null"] }
    ProcessingStatus:
      type: object
      additionalProperties: false
      required: [revisionState, scanState, job]
      properties:
        revisionState: { type: string, enum: [pending, quarantined, processing, ready, failed, rejected] }
        scanState: { type: string, enum: [pending, scanning, clean, failed, rejected] }
        job: { anyOf: [{ $ref: "#/components/schemas/ProcessingJob" }, { type: "null" }] }
    ProcessingUpload:
      type: object
      additionalProperties: false
      required: [method, uploadUrl, partSize, headers, expiresAt]
      properties:
        method: { type: string, enum: [single, multipart] }
        uploadUrl: { type: [string, "null"] }
        partSize: { type: integer, const: 8388608 }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }
    ProcessingPart:
      type: object
      additionalProperties: false
      required: [uploadUrl, bytes, expiresAt]
      properties:
        uploadUrl: { type: string }
        bytes: { type: integer, minimum: 1, maximum: 8388608 }
        expiresAt: { type: string, format: date-time }
