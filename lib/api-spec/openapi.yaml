  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/health:
    get:
      operationId: getFoundationHealth
      tags: [health]
      responses:
        "200":
          description: Foundation readiness without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationHealth"
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Application profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401": { description: Invalid or missing authentication }
        "403": { description: Unverified identity or inactive account }
        "503": { description: Identity service unavailable or unconfigured }
    patch:
      operationId: updateCurrentUser
      tags: [identity]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated permitted profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400": { description: "Invalid input, including client-supplied roles/status/identity" }
        "401": { description: Unauthenticated }
        "403": { description: Inactive account }
  /v1/student/protected:
    get:
      operationId: getStudentProtected
      tags: [identity]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Student authorization confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedPage"
        "401": { description: Unauthenticated }
        "403": { description: Forbidden }
  /v1/admin/protected:
    get:
      operationId: getAdminProtected
      tags: [identity]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin authorization confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedPage"
        "401": { description: Unauthenticated }
        "403": { description: Forbidden }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AssessmentQuizPolicy:
      $ref: "./assessments.yaml#/components/schemas/AssessmentQuizPolicy"
    AssessmentAnswer:
      $ref: "./assessments.yaml#/components/schemas/AssessmentAnswer"
    AssessmentStudentQuestion:
      $ref: "./assessments.yaml#/components/schemas/AssessmentStudentQuestion"
    AssessmentAnswerState:
      $ref: "./assessments.yaml#/components/schemas/AssessmentAnswerState"
    AssessmentReviewFlag:
      $ref: "./assessments.yaml#/components/schemas/AssessmentReviewFlag"
    AssessmentEvidenceContext:
      $ref: "./assessments.yaml#/components/schemas/AssessmentEvidenceContext"
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    FoundationHealth:
      type: object
      required: [status, database, authentication, phase]
      properties:
        status: { type: string }
        database: { type: string, enum: [ready, unavailable] }
        authentication: { type: string, enum: [configured, configuration_required] }
        phase: { type: string, enum: ["1A", "1B"] }
    UserProfile:
      type: object
      required: [id, email, displayName, status, preferredLocale, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, suspended, deleted] }
        preferredLocale: { type: string, enum: [ar, en] }
        roles:
          type: array
          items: { type: string, enum: [student, admin] }
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        preferredLocale: { type: string, enum: [ar, en] }
    ProtectedPage:
      type: object
      required: [area, user]
      properties:
        area: { type: string, enum: [student, admin] }
        user:
          $ref: "#/components/schemas/UserProfile"
